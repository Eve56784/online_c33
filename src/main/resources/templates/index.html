<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Students</title>
</head>
<body>

<h1>Student list</h1>
<table border="1" style="border-width: 1px; border-spacing: 0; border-style: solid">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Course</th>
        <th>GPA</th>
        <th>Student Council Member</th>
    </tr>
    </thead>
    <tbody th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.firstName}"></td>
        <td th:text="${student.lastName}"></td>
        <td th:text="${student.course}"></td>
        <td th:text="${student.gpa}"></td>
        <td th:text="${student.studentCouncilMember}"></td>
    </tbody>
</table>

<h2>Add student</h2>
<form th:action="@{/add}" method="post" th:object="${addStudent}">
    <div th:if="${#fields.hasErrors('*')}">
        <ul>
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
        </ul>
    </div>
    <input type="number" th:field="*{id}" placeholder="ID"/><br>
    <input type="text" th:field="*{firstName}" placeholder="First Name"/><br>
    <input type="text" th:field="*{lastName}" placeholder="Last Name"/><br>
    <input type="number" th:field="*{course}" placeholder="Course"/><br>
    <input type="number" th:field="*{gpa}" step="0.01" placeholder="GPA"/><br>
    <label>
        <input type="checkbox" th:field="*{studentCouncilMember}"/>Council Member
    </label><br>
    <button type="submit">Add Student</button>
</form>

<h2>Delete Student</h2>
<p th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></p>
<form th:action="@{/delete}" method="post" th:object="${deleteStudent}">
    <input type="number" th:field="*{id}" placeholder="ID"/>
    <button type="submit">Delete</button>
</form>
</body>
</html>
